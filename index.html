<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BISPL-WM Projects</title>
<meta name="description" content="Project pages of BISPL-WM: GALILEO and Mind the Band.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a short left-aligned masthead, then one row of project cards (picture, name, title, links) that stacks on phones. */
:root {
  --bg: #f5f6f4; --card: #ffffff; --ink: #16191c; --dim: #50565c; --faint: #858b91; --line: #dfe2df; --accent: #1f6f68;
  --display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --body: "Inter", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121416; --card: #1a1d20; --ink: #eceeee; --dim: #b3b8bc; --faint: #80868b; --line: #2b2f33; --accent: #6cc4b8; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121416; --card: #1a1d20; --ink: #eceeee; --dim: #b3b8bc; --faint: #80868b; --line: #2b2f33; --accent: #6cc4b8; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { padding-block: 56px 28px; }
header h1 { margin: 0; font: 600 clamp(34px, 5vw, 52px)/1 var(--display); letter-spacing: -.01em; }
header p { margin: 10px 0 0; color: var(--dim); font-size: 17px; }
main { padding-block: 0 64px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
.card { min-width: 0; display: grid; gap: 14px; align-content: start; }
.shot { display: block; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--card); }
.shot img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; transition: transform .35s ease; }
.shot:hover img, .shot:focus-visible img { transform: scale(1.015); }
.name { margin: 0; font: 600 clamp(24px, 2.6vw, 30px)/1.15 var(--display); text-wrap: balance; }
.name a { color: inherit; text-decoration: none; }
.name a:hover { color: var(--accent); }
.title { margin: 0; color: var(--dim); max-width: 52ch; }
.links { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 2px 0 0; padding: 0; list-style: none; font-size: 15px; font-weight: 500; }
.links a { color: var(--accent); text-decoration: none; }
.links a:hover { text-decoration: underline; text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
@media (max-width: 720px) { .grid { grid-template-columns: minmax(0, 1fr); gap: 40px; } header { padding-block: 40px 22px; } }
@media (prefers-reduced-motion: reduce) { .shot img { transition: none; } }
</style>

</head>
<body>
<header class="wrap">
  <h1>BISPL-WM</h1>
  <p>Project pages</p>
</header>

<main class="wrap">
  <div class="grid">
    <article class="card">
      <a class="shot" href="https://bispl-wm.github.io/GALILEO/" aria-label="GALILEO project page"><img src="assets/galileo.webp" alt="The GALILEO project page: title, authors and the clip figure" width="1280" height="720"></a>
      <h2 class="name"><a href="https://bispl-wm.github.io/GALILEO/">GALILEO</a></h2>
      <p class="title">Geometric RoPE with Galilean Key Transport for Dynamic Scenes</p>
      <ul class="links">
        <li><a href="https://bispl-wm.github.io/GALILEO/">Project page</a></li>
        <li><a href="https://arxiv.org/abs/2611.29293">arXiv</a></li>
        <li><a href="https://github.com/BISPL-WM/GALILEO-code">Code</a></li>
        <li><a href="https://huggingface.co/ggred0123/GALILEO">Checkpoints</a></li>
      </ul>
    </article>
    <article class="card">
      <a class="shot" href="https://bispl-wm.github.io/MindTheBand/" aria-label="Mind the Band project page"><img src="assets/mindtheband.webp" alt="Mind the Band: a rendered view stays sharp when the frequency band is in range" width="1280" height="720"></a>
      <h2 class="name"><a href="https://bispl-wm.github.io/MindTheBand/">Mind the Band</a></h2>
      <p class="title">The Hidden Frequency Variable in Geometric RoPE</p>
      <ul class="links">
        <li><a href="https://bispl-wm.github.io/MindTheBand/">Project page</a></li>
      </ul>
    </article>
  </div>
</main>
</body>
</html>
